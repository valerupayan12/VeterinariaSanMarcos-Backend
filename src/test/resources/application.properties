# Configuracion de pruebas: H2 en memoria para no depender de MySQL/XAMPP.
spring.datasource.url=jdbc:h2:mem:veterinaria_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT para que Spring pueda crear el contexto de seguridad en pruebas.
# Sin estas propiedades, la app falla con "Could not resolve placeholder 'jwt.secret'".
jwt.secret=Y29udm8xMjM0NTY3ODkwYWJjZGVmMTIzNDU2Nzg5MA==
jwt.expiration=3600000

# Flyway desactivado en pruebas para usar H2 en memoria.
spring.flyway.enabled=false
