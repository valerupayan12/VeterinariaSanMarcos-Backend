spring.application.name=veterinaria-sanmarcos-backend

server.port=8081

# MySQL / XAMPP configuration
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_san_marcos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Mexico_City
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method



# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate

# JWT
jwt.secret=Y29udm8xMjM0NTY3ODkwYWJjZGVmMTIzNDU2Nzg5MA==
jwt.expiration=3600000