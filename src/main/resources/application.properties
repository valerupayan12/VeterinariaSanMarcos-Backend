spring.application.name=veterinaria-sanmarcos-backend

server.port=8081

# MySQL / XAMPP configuration
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_san_marcos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Mexico_City
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method



# Flyway - se mantiene desactivado para no afectar el arranque actual.
# Los scripts quedan versionados en src/main/resources/db/migration.
# Para activarlo: spring.flyway.enabled=true y spring.jpa.hibernate.ddl-auto=validate
# (si la BD ya tiene las tablas creadas por Hibernate, borrarla antes para que V1 las cree).
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true